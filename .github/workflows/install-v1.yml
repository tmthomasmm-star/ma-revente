name: Installer Ma Revente V2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Préparer la V2
        run: |
          if [ -f Ma-Revente-V2.zip ]; then
            unzip -o Ma-Revente-V2.zip
            rm Ma-Revente-V2.zip
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enregistrer la V2
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Installer Ma Revente V2" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: Ma-Revente-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
